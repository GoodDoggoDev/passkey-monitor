name: Passkey Hotel Monitor

on:
  schedule:
    # Runs every 5 minutes, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allows you to manually trigger from the Actions tab

permissions:
  contents: write  # Needed to commit updated hotel_state.json

jobs:
  check-hotels:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run hotel monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "Hotel Monitor Bot"
          git config user.email "bot@monitor.local"
          git add hotel_state.json
          git diff --cached --quiet || {
            git commit -m "Update hotel state $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git pull --rebase origin main || true
            git push
          }
